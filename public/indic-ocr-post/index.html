    <!-- site-patch: applied by the Bodhan website when this build is mounted.
         1. Scroll-in reveals: the bundle animates sections into view with
            framer-motion's whileInView (IntersectionObserver). The site shows
            content at rest, so every observed element is reported as in view
            at once; the real observer is kept for the host page's own use.
         2. Image skeletons: any <img> shows a cream shimmer until it has
            loaded, including images the sliders swap in later. -->
    <script>
      (function () {
        var Real = window.IntersectionObserver;
        window.__RealIntersectionObserver = Real;
        function AlwaysInView(callback) {
          this._cb = callback; this._targets = new Set();
          this.root = null; this.rootMargin = '0px'; this.thresholds = [0];
        }
        AlwaysInView.prototype.observe = function (el) {
          if (this._targets.has(el)) return;
          this._targets.add(el);
          var self = this;
          Promise.resolve().then(function () {
            if (!self._targets.has(el)) return;
            var rect = el.getBoundingClientRect();
            self._cb([{ target: el, isIntersecting: true, intersectionRatio: 1,
              boundingClientRect: rect, intersectionRect: rect, rootBounds: null, time: performance.now() }], self);
          });
        };
        AlwaysInView.prototype.unobserve = function (el) { this._targets.delete(el); };
        AlwaysInView.prototype.disconnect = function () { this._targets.clear(); };
        AlwaysInView.prototype.takeRecords = function () { return []; };
        window.IntersectionObserver = AlwaysInView;
      })();
    </script>

    </style>
    <script>
      (function () {
        var skip = /\/logos\//;
        function mark(img) {
          if (skip.test(img.getAttribute('src') || '')) return;
          if (img.complete && img.naturalWidth > 0) { img.classList.remove('is-loading'); return; }
          img.classList.add('is-loading');
          var done = function () { img.classList.remove('is-loading'); };
          img.addEventListener('load', done, { once: true });
          img.addEventListener('error', done, { once: true });
        }
        function scan(root) {
          if (root.nodeType !== 1) return;
          if (root.tagName === 'IMG') mark(root);
          root.querySelectorAll && root.querySelectorAll('img').forEach(mark);
        }
        new MutationObserver(function (records) {
          records.forEach(function (r) {
            if (r.type === 'attributes') { mark(r.target); return; }
            r.addedNodes.forEach(scan);
          });
        }).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['src', 'srcset'] });
        document.addEventListener('DOMContentLoaded', function () { scan(document.documentElement); });
      })();
    </script>

    <!-- Site overrides: this post is shown inside bodhan.ai's own chrome (see
         src/features/research/indic-ocr-post/IndicOcrPostPage.jsx). Static so it
         applies on every load, before the bundle renders. -->
    <style id="site-overrides">
      /* Chrome the site provides itself. */
      footer, .footer, .progress, .rail, .ecosystem { display: none !important; }
      /* The frame never scrolls itself; the page surface shows through it. */
      html, body { overflow: hidden !important; background: transparent !important; }
      /* Publications' column geometry: the 1.25rem gutter inside the 56rem/64rem columns. */
      .page { padding: 0 !important; }
      .column { max-width: min(56rem, calc(100vw - 2rem)) !important; padding: 0 1.25rem; box-sizing: border-box; }
      .wide { max-width: min(64rem, calc(100vw - 2rem)) !important; padding: 0 1.25rem; box-sizing: border-box; }
      .section-header { margin: 3rem 0 1.25rem !important; }

      /* Tables: one header style; benchmark headers are model names, so no capitals. */
      table.md { width: 100% !important; table-layout: auto; }
      table.md thead th { text-transform: none !important; letter-spacing: 0 !important; font-size: .75rem !important; font-weight: 700 !important; color: var(--text-primary) !important; text-align: center !important; }
      table.md thead th:first-child { text-align: left !important; }
      .bench-module table.md th, .bench-module table.md td { white-space: normal !important; }
      .tbl-html th { font-weight: 700; background: rgba(255, 247, 237, .9); }
      /* Demo captions share the small-caps eyebrow used by the section labels. */
      .tbl-cap { font-size: .6875rem !important; font-weight: 700 !important; letter-spacing: .1em !important; text-transform: uppercase !important; color: var(--text-orange-500) !important; }
      /* The Table Recognition tab strip renders bare labels; style them exactly like the
         book demos' tabs (Printed / Handwritten), including the active tab's surface. */
      .bk-pill { --panel-bg: #fffdf9; }
      .bk-pill:not(:has(.bk-pill-en)) { font-family: var(--font-manrope) !important; font-size: .6875rem !important; font-weight: 700 !important; letter-spacing: .05em !important; text-transform: uppercase !important; color: var(--color-11) !important; }
      .bk-pill.on:not(:has(.bk-pill-en)) { color: var(--text-orange-500) !important; background: #fffdf9 !important; box-shadow: inset 0 2px 0 var(--text-orange-500) !important; }
      /* Benchmark tabs (OmniDocBench, olmOCR, IndicOCR-Printed, IndicOCR-Handwriting): the
         same tab treatment as the demo strips, minus the capitals (these are proper names). */
      .folder-tabs { background: linear-gradient(180deg, #fbf0e2, #fefaf4) !important; }
      .folder-tab { font-family: var(--font-manrope) !important; font-size: .75rem !important; font-weight: 700 !important; letter-spacing: .02em !important; color: var(--color-11) !important; padding: .7rem 1.1rem .72rem !important; border-right: 1px solid rgba(46, 50, 56, .06) !important; }
      /* Share the strip's full width between the tabs, like the demo strips' grid, so the
         last tab ends at the panel's right edge instead of leaving a gap. */
      .folder-tabs { display: flex !important; }
      .folder-tab { flex: 1 1 0 !important; min-width: 0; text-align: center; white-space: normal !important; }
      .folder-tab:last-child { border-right: 0 !important; }
      .folder-tab:hover { background: #ffffffb3 !important; color: var(--text-primary) !important; }
      .folder-tab.on { color: var(--text-orange-500) !important; background: #fffdf9 !important; box-shadow: inset 0 2px 0 var(--text-orange-500) !important; }
      /* Small screens: the table scrolls sideways; the label column stays put with a rule. */
      @media (max-width: 700px) {
        table.md th:first-child, table.md td:first-child { position: sticky; left: 0; z-index: 1; background: var(--bg-cream-50, #fff9f0); border-right: 1px solid var(--hairline, rgba(92, 64, 51, .18)); }

        .langtab, .langtab.end-col, .bk-pill, .bk-pill:last-child, .folder-tab, .folder-tab:last-child { border-right: 1px solid var(--border) !important; }

    <!-- The opening frame lives here rather than in the bundle: rendered by
         React it could only appear once the bundle had downloaded, which on a
         slow connection is exactly when it is wanted. -->
    <style>
      body { margin: 0; background: #fffaf3; }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: grid;
        place-items: center;
        background: #fffaf3;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #splash.out { opacity: 0; visibility: hidden; pointer-events: none; }
      /* splash-off: the site shows this post inside its own chrome and has no load
         animation on other pages, so the splash is disabled here. */
      #splash { display: none !important; }
      #splash img {
        width: clamp(84px, 12vw, 132px);
        height: auto;
        animation: splash-breathe 2.4s ease-in-out infinite;
      }
      @keyframes splash-breathe {
        0%, 100% { opacity: 0.45; transform: scale(0.96); }
        50% { opacity: 1; transform: scale(1.02); }
      }
      @media (prefers-reduced-motion: reduce) { #splash img { animation: none; opacity: 0.9; } }
    </style>
    <div id="splash" role="status" aria-label="Loading">
