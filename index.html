  <!-- Legacy hash-route redirect: /#/careers -> /careers (runs before the app mounts) -->
  <script>
    (function () {
      var h = window.location.hash;
      if (h.indexOf('#/') === 0) {
        var target = h.slice(1); // keeps path + query + nested hash
        var base = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
        window.location.replace(base + target);
      }
    })();
  </script>
